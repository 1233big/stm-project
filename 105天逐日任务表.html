 {d:"02.07",wd:"周日",h:"4h",t:"烧录点灯 + 问题记录",ta:["烧录点灯程序","记录焊接中出现的问题","周报"],tp:"实理杂",st:"灯亮了"}
]},

{w:15, range:"02.08 – 02.14", theme:"全功能验证与寒假复盘", mod:"M3 / M5",
 goal:"板子上每个功能都被验证过；把两个月变成一份可复用的复盘。",
 days:[
 {d:"02.08",wd:"周一",h:"3h",t:"验证 LED 与按键",ta:["逐个点亮 LED","按键响应与消抖","记录测试结果"],tp:"实实实",st:"全部正常"},

 {d:"02.11",wd:"周四",h:"3h",t:"低功耗实测",ta:["测 Sleep / Stop / Standby 三种模式电流","做一张电流对比表","测唤醒时间"],tp:"实理实",st:"有完整的数据表"},

 {d:"02.14",wd:"周日",h:"4h",t:"仓库归档 + 周报",ta:["硬件资料归档（原理图/PCB/BOM/焊接记录）","README 写清板子能做什么","周报"],tp:"杂理杂",st:"GitHub 仓库完整"}

/* ---------- render ---------- */
const KEY = 'daily-plan-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }

const navEl = document.getElementById('nav');
const planEl = document.getElementById('plan');
let total = 0;

PLAN.forEach((wk) => {
  const a = document.createElement('a');
  a.href = '#w' + wk.w;
  a.textContent = 'W' + wk.w;
  navEl.appendChild(a);

  const sec = document.createElement('section');
  sec.className = 'week';
  sec.id = 'w' + wk.w;

  let body = '';
  wk.days.forEach((day, di) => {
    const isRest = wk.w === 11;
    body += `<article class="day${isRest ? ' rest' : ''}">
      <div class="day-h">
        <div class="date"><b>${day.d}</b><span>${day.wd}</span></div>
        <h3>${day.t}</h3>
        <span class="hrs">${day.h}</span>
      </div>
      <div class="day-b"><ul>`;
    day.ta.forEach((t, ti) => {
      const id = `w${wk.w}d${di}t${ti}`;
      const k = (day.tp || '')[ti] || '';
      const cls = k === '理' ? 'tg-l' : (k === '实' ? 'tg-p' : 'tg-n');
      const badge = k ? `<i class="tg ${cls}">${k}</i>` : '';
      total++;
      const ck = saved[id] ? ' checked' : '';
      body += `<li data-t="${k}"><label><input type="checkbox" data-id="${id}"${ck}>${badge}<span>${t}</span></label></li>`;
    });
    body += `</ul></div>
      <div class="std"><b>完成标准：</b>${day.st}</div>
    </article>`;
  });

  sec.innerHTML = `
    <div class="wkhead">
      <div class="wkn">W${wk.w}</div>
      <div class="wkt"><h2>${wk.theme}</h2><div class="sub">${wk.range}</div></div>
      <div class="wkside"><span class="pill mod">${wk.mod}</span><span class="pill cnt" data-cnt>0/0</span></div>
    </div>
    <div class="goal">本周目标：${wk.goal}</div>
    ${body}`;
  planEl.appendChild(sec);
});

/* ---------- progress ---------- */
const all = Array.prototype.slice.call(document.querySelectorAll('#plan input[type=checkbox]'));
const fill = document.getElementById('fill');
const pct = document.getElementById('pct');

function render() {
  let done = 0;
  all.forEach(b => { if (b.checked) done++; });
  fill.style.width = (done / all.length * 100) + '%';
  pct.textContent = done + ' / ' + all.length;

  document.querySelectorAll('.week').forEach(sec => {
    const bs = Array.prototype.filter.call(sec.querySelectorAll('input'),
      b => b.closest('li') && b.closest('li').offsetParent !== null);
    const d = bs.filter(b => b.checked).length;
    const tag = sec.querySelector('[data-cnt]');
    if (tag) tag.textContent = d + '/' + bs.length;
  });
}

all.forEach(b => {
  b.addEventListener('change', () => {
    saved[b.dataset.id] = b.checked;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    render();
  });
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('清空所有勾选记录？')) return;
  saved = {};
  try { localStorage.removeItem(KEY); } catch (e) {}
  all.forEach(b => { b.checked = false; });
  render();
});

/* ---------- 理 / 实 / 杂 筛选 ---------- */
const FILT = { '理': 'f-l', '实': 'f-p', '杂': 'f-n' };
const fbtns = Array.prototype.slice.call(document.querySelectorAll('#filt button'));

function applyFilter(f) {
  document.body.classList.remove('f-l', 'f-p', 'f-n');
  if (FILT[f]) document.body.classList.add(FILT[f]);
  fbtns.forEach(b => b.classList.toggle('on', b.dataset.f === f));

  const days = Array.prototype.slice.call(document.querySelectorAll('.day'));
  days.forEach(d => d.classList.remove('hide'));
  days.forEach(d => {
    const vis = Array.prototype.some.call(d.querySelectorAll('.day-b li'),
      x => x.offsetParent !== null);
    d.classList.toggle('hide', !vis);
  });
  render();
}

fbtns.forEach(b => b.addEventListener('click', () => applyFilter(b.dataset.f)));

const counts = { '理': 0, '实': 0, '杂': 0 };
PLAN.forEach(wk => wk.days.forEach(d => (d.tp || '').split('').forEach(c => {
  if (counts[c] !== undefined) counts[c]++;
})));
fbtns.forEach(b => {
  const n = b.dataset.f === 'all' ? total : counts[b.dataset.f];
  b.querySelector('b').textContent = n;
});

render();
</script>
